<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>RVU Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F5F0;
    --surface: #FFFFFF;
    --ink: #1C2321;
    --ink-soft: #5B645F;
    --line: #DBD6C9;
    --line-soft: #EAE7DE;
    --accent: #2B5D53;
    --accent-soft: #E4EDE9;
    --accent-ink: #FFFFFF;
    --error: #A6432E;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body { padding-bottom: 92px; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 14px 8px; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 6px 4px 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }

  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  #today { font-size: 0.85rem; color: var(--ink-soft); font-weight: 500; }

  .reset-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 8px 12px;
    border-radius: 7px;
    margin-top: 4px;
  }
  .reset-btn:active { background: var(--line-soft); }

  .edit-btn {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 6px 8px;
    border-radius: 6px;
  }
  .edit-btn:active { background: var(--line-soft); }

  section { margin-bottom: 30px; }

  .section-title { font-size: 0.95rem; font-weight: 600; margin: 0 0 3px; }
  .section-sub { font-size: 0.8rem; color: var(--ink-soft); margin: 0 0 12px; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }

  thead th {
    text-align: left;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--ink-soft);
    padding: 9px 10px;
    border-bottom: 1px solid var(--line);
    background: var(--line-soft);
  }
  thead th.num { text-align: right; }

  tbody td {
    padding: 10px 10px;
    border-bottom: 1px solid var(--line-soft);
    font-size: 0.92rem;
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:nth-child(even) { background: #FBFAF7; }

  td.name { font-weight: 500; }
  td.rvu, td.total {
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  td.total { color: var(--ink); font-weight: 600; }
  td.count-cell { width: 84px; }

  input.count {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    font-variant-numeric: tabular-nums;
    text-align: center;
    padding: 10px 4px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--paper);
    color: var(--ink);
  }
  input.count:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  tfoot td {
    padding: 12px 10px;
    font-size: 0.92rem;
    border-top: 2px solid var(--line);
    background: var(--accent-soft);
  }
  tfoot td.total { font-size: 1.05rem; font-weight: 700; color: var(--accent); }

  .monthly-value {
    font-size: 1.9rem;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .save-btn {
    width: 100%;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 600;
    padding: 15px 10px;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: var(--accent-ink);
  }
  .save-btn:active { opacity: 0.85; }

  .save-status {
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin: 10px 2px 0;
  }
  .save-status.is-error { color: var(--error); }
  .save-status.is-success { color: var(--accent); font-weight: 600; }

  .totalbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--accent);
    color: var(--accent-ink);
    padding: 16px 18px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    box-shadow: 0 -4px 14px rgba(0,0,0,0.12);
  }
  .totalbar-label { font-size: 0.85rem; font-weight: 500; opacity: 0.85; }
  .totalbar-value { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }

  @media (max-width: 400px) {
    thead th, tbody td { padding: 8px 6px; font-size: 0.85rem; }
    h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>RVU Tracker</h1>
    <span id="today"></span>
  </header>

  <section>
    <p class="section-title">Office</p>
    <p class="section-sub">Visit counts &times; RVU = office total</p>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th class="num">RVU</th>
          <th class="num">Count</th>
          <th class="num">Total</th>
          <th class="num">Edit</th>
        </tr>
      </thead>
      <tbody id="office-body"></tbody>
      <tfoot>
        <tr>
          <td colspan="3" style="text-align:right; font-weight:600;">Today&rsquo;s office total</td>
          <td class="total" id="office-total">0.00</td>
          <td></td>
        </tr>
      </tfoot>
    </table>
    <div class="add-row" style="margin-top:12px; display:flex; gap:8px; align-items:center;">
      <input id="new-office-name" type="text" placeholder="Office item" style="flex:1; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:7px; background:var(--surface);">
      <input id="new-office-rvu" type="number" min="0" step="0.01" placeholder="RVU" style="width:84px; font:inherit; padding:10px 8px; border:1px solid var(--line); border-radius:7px; background:var(--surface);">
      <button id="add-office-btn" class="reset-btn" type="button">Add</button>
    </div>
  </section>

  <section>
    <p class="section-title">Procedures</p>
    <p class="section-sub">RVU per unit &times; count = total</p>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th class="num">RVU</th>
          <th class="num">Count</th>
          <th class="num">Total</th>
          <th class="num">Edit</th>
        </tr>
      </thead>
      <tbody id="proc-body"></tbody>
      <tfoot>
        <tr>
          <td colspan="3" style="text-align:right; font-weight:600;">Grand total</td>
          <td class="total" id="table-grand-total">0.00</td>
          <td></td>
        </tr>
      </tfoot>
    </table>
    <div class="add-row" style="margin-top:12px; display:flex; gap:8px; align-items:center;">
      <input id="new-proc-name" type="text" placeholder="Procedure name" style="flex:1; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:7px; background:var(--surface);">
      <input id="new-proc-rvu" type="number" min="0" step="0.01" placeholder="RVU" style="width:84px; font:inherit; padding:10px 8px; border:1px solid var(--line); border-radius:7px; background:var(--surface);">
      <button id="add-proc-btn" class="reset-btn" type="button">Add</button>
    </div>
    <button class="reset-btn" id="reset-btn" style="margin-top:12px;">Clear all entries</button>
  </section>

  <section id="monthly-section">
    <p class="section-title">Monthly total</p>
    <p class="section-sub" id="monthly-label-month">&nbsp;</p>
    <div class="monthly-value" id="monthly-total">0.00</div>
  </section>

  <section id="save-section">
    <button id="save-btn" class="save-btn">Save today's total</button>
    <p id="save-status" class="save-status">Not saved yet</p>
  </section>
</div>

<div class="totalbar">
  <span class="totalbar-label">Today&rsquo;s RVU total</span>
  <span class="totalbar-value" id="grand-total">0.00</span>
</div>

<script>
  const STORAGE_KEY = 'rvuTrackerHistory';
  const CUSTOM_ITEMS_KEY = 'rvuTrackerCustomItems';
  let history = [];

  const DEFAULT_OFFICE_ROWS = [
    { name: 'New level 4', rvu: 0 },
    { name: 'Return level 4', rvu: 0 },
    { name: 'Pessary fitting', rvu: 0.87 },
    { name: 'Pelvic exam', rvu: 0 }
  ];

  const DEFAULT_PROC_ROWS = [
    ['Pessary fitting', 0.87],
    ['Urod.', 4.13],
    ['Cysto', 1.49],
    ['Cysto w/washings', 1.49],
    ['Cysto w/hydro', 3.13],
    ['Bladder Botox', 3.12],
    ['Sling', 11.11],
    ['Interstim test', 1],
    ['Interstim implant', 1],
    ['Interstim removal & replacement', 1],
    ['Anterior colporrhaphy', 9.94],
    ['Rectocele', 11.21],
    ['Vaginal vault suspension', 1],
    ['VH', 1],
    ['RH/BS', 1]
  ];

  let officeRows = DEFAULT_OFFICE_ROWS.map(row => ({ name: row.name, rvu: Number(row.rvu) || 0 }));
  let procRows = DEFAULT_PROC_ROWS.map(([name, rvu]) => [name, Number(rvu)]);

  const officeBody = document.getElementById('office-body');
  const procBody = document.getElementById('proc-body');

  function renderOfficeRows() {
    officeBody.innerHTML = '';
    officeRows.forEach((row, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="name">${row.name}</td>
        <td class="rvu">${Number(row.rvu).toFixed(2)}</td>
        <td class="count-cell">
          <input class="count" type="text" inputmode="decimal"
            pattern="[0-9]*\\.?[0-9]*" id="office-${i}" aria-label="${row.name} count">
        </td>
        <td class="total" id="office-total-${i}">0.00</td>
        <td><button class="edit-btn" type="button" data-type="office" data-index="${i}">Edit</button></td>`;
      officeBody.appendChild(tr);
    });
  }

  function renderProcedureRows() {
    procBody.innerHTML = '';
    procRows.forEach(([name, rvu], i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="name">${name}</td>
        <td class="rvu">${Number(rvu).toFixed(2)}</td>
        <td class="count-cell">
          <input class="count" type="text" inputmode="decimal"
            pattern="[0-9]*\\.?[0-9]*" id="proc-${i}" data-rvu="${rvu}" aria-label="${name} count">
        </td>
        <td class="total" id="proc-total-${i}">0.00</td>
        <td><button class="edit-btn" type="button" data-type="procedure" data-index="${i}">Edit</button></td>`;
      procBody.appendChild(tr);
    });
  }

  function saveCustomRows() {
    try {
      const customOffice = officeRows.filter(row => !DEFAULT_OFFICE_ROWS.some(defaultRow =>
        defaultRow.name === row.name && Number(defaultRow.rvu) === Number(row.rvu)
      )).map(row => ({ name: row.name, rvu: Number(row.rvu) || 0 }));

      const customProcedures = procRows.filter(([name, rvu]) => !DEFAULT_PROC_ROWS.some(([defaultName, defaultRvu]) =>
        defaultName === name && Number(defaultRvu) === Number(rvu)
      )).map(([name, rvu]) => ({ name, rvu: Number(rvu) || 0 }));

      localStorage.setItem(CUSTOM_ITEMS_KEY, JSON.stringify({ office: customOffice, procedures: customProcedures }));
    } catch (e) {
      console.warn('Could not persist custom rows.', e);
    }
  }

  function loadCustomRows() {
    try {
      const raw = localStorage.getItem(CUSTOM_ITEMS_KEY);
      if (!raw) return;

      const parsed = JSON.parse(raw);
      const customOffice = Array.isArray(parsed.office) ? parsed.office : [];
      const customProcedures = Array.isArray(parsed.procedures) ? parsed.procedures : [];

      officeRows = [
        ...DEFAULT_OFFICE_ROWS.map(row => ({ name: row.name, rvu: Number(row.rvu) || 0 })),
        ...customOffice
          .filter(item => item && typeof item.name === 'string' && item.name.trim())
          .map(item => ({ name: item.name.trim(), rvu: Number(item.rvu) || 0 }))
      ];

      procRows = [
        ...DEFAULT_PROC_ROWS.map(([name, rvu]) => [String(name), Number(rvu)]),
        ...customProcedures
          .filter(item => item && typeof item.name === 'string' && item.name.trim())
          .map(item => [item.name.trim(), Number(item.rvu)])
          .filter(([, rvu]) => Number.isFinite(rvu) && rvu >= 0)
      ];
    } catch (e) {
      officeRows = DEFAULT_OFFICE_ROWS.map(row => ({ name: row.name, rvu: Number(row.rvu) || 0 }));
      procRows = DEFAULT_PROC_ROWS.map(([name, rvu]) => [name, Number(rvu)]);
    }
  }

  function updateRowEdit(type, index) {
    if (type === 'office') {
      const row = officeRows[index];
      if (!row) return;

      const newName = window.prompt('Edit office item name:', row.name);
      if (newName === null) return;
      const trimmedName = newName.trim();
      if (!trimmedName) {
        setStatus('Office item name cannot be blank.', true);
        return;
      }

      const newRvuText = window.prompt('Edit office RVU:', String(row.rvu));
      const newRvu = Number.parseFloat(newRvuText);
      if (newRvuText === null || !Number.isFinite(newRvu) || newRvu < 0) {
        setStatus('Enter a valid office RVU value.', true);
        return;
      }

      officeRows[index] = { name: trimmedName, rvu: newRvu };
      saveCustomRows();
      renderOfficeRows();
      recalc();
      setStatus('Office item updated', false, true);
      return;
    }

    const row = procRows[index];
    if (!row) return;

    const newName = window.prompt('Edit procedure name:', row[0]);
    if (newName === null) return;
    const trimmedName = newName.trim();
    if (!trimmedName) {
      setStatus('Procedure name cannot be blank.', true);
      return;
    }

    const newRvuText = window.prompt('Edit procedure RVU:', String(row[1]));
    const newRvu = Number.parseFloat(newRvuText);
    if (newRvuText === null || !Number.isFinite(newRvu) || newRvu < 0) {
      setStatus('Enter a valid procedure RVU value.', true);
      return;
    }

    procRows[index] = [trimmedName, newRvu];
    saveCustomRows();
    renderProcedureRows();
    recalc();
    setStatus('Procedure updated', false, true);
  }

  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function formatDateShort(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m-1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function setStatus(msg, isError, isSuccess) {
    const el = document.getElementById('save-status');
    el.textContent = msg;
    el.classList.toggle('is-error', !!isError);
    el.classList.toggle('is-success', !!isSuccess);
  }

  function recalc() {
    let officeGrand = 0;
    officeRows.forEach((row, i) => {
      const input = document.getElementById(`office-${i}`);
      const val = input ? parseFloat(input.value) : 0;
      const count = Number.isFinite(val) ? val : 0;
      const rowTotal = Number(row.rvu) * count;
      const totalEl = document.getElementById(`office-total-${i}`);
      if (totalEl) totalEl.textContent = rowTotal.toFixed(2);
      officeGrand += rowTotal;
    });

    let procGrand = 0;
    procRows.forEach(([name, rvu], i) => {
      const input = document.getElementById(`proc-${i}`);
      const val = input ? parseFloat(input.value) : 0;
      const count = Number.isFinite(val) ? val : 0;
      const rowTotal = Number(rvu) * count;
      const totalEl = document.getElementById(`proc-total-${i}`);
      if (totalEl) totalEl.textContent = rowTotal.toFixed(2);
      procGrand += rowTotal;
    });

    const grand = officeGrand + procGrand;
    document.getElementById('office-total').textContent = officeGrand.toFixed(2);
    document.getElementById('grand-total').textContent = grand.toFixed(2);
    document.getElementById('table-grand-total').textContent = grand.toFixed(2);
  }

  officeBody.addEventListener('input', () => {
    recalc();
    setStatus('Not saved yet');
  });

  procBody.addEventListener('input', () => {
    recalc();
    setStatus('Not saved yet');
  });

  document.body.addEventListener('click', (event) => {
    const button = event.target.closest('.edit-btn');
    if (!button) return;
    updateRowEdit(button.dataset.type, Number(button.dataset.index));
  });

  document.body.addEventListener('focusin', (e) => {
    if (e.target.classList.contains('count')) {
      setTimeout(() => e.target.select(), 0);
    }
  });

  document.getElementById('reset-btn').addEventListener('click', () => {
    document.querySelectorAll('input.count').forEach(inp => inp.value = '');
    recalc();
    setStatus('Not saved yet');
  });

  document.getElementById('add-office-btn').addEventListener('click', () => {
    const nameInput = document.getElementById('new-office-name');
    const rvuInput = document.getElementById('new-office-rvu');
    const name = nameInput.value.trim();
    const rvu = Number.parseFloat(rvuInput.value);

    if (!name) {
      setStatus('Enter a name for the office item.', true);
      nameInput.focus();
      return;
    }

    if (!Number.isFinite(rvu) || rvu < 0) {
      setStatus('Enter a valid office RVU value.', true);
      rvuInput.focus();
      return;
    }

    officeRows.push({ name, rvu });
    nameInput.value = '';
    rvuInput.value = '';
    renderOfficeRows();
    recalc();
    saveCustomRows();
    setStatus('Office item added', false, true);
  });

  document.getElementById('new-office-name').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      document.getElementById('add-office-btn').click();
    }
  });

  document.getElementById('new-office-rvu').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      document.getElementById('add-office-btn').click();
    }
  });

  document.getElementById('add-proc-btn').addEventListener('click', () => {
    const nameInput = document.getElementById('new-proc-name');
    const rvuInput = document.getElementById('new-proc-rvu');
    const name = nameInput.value.trim();
    const rvu = Number.parseFloat(rvuInput.value);

    if (!name) {
      setStatus('Enter a procedure name.', true);
      nameInput.focus();
      return;
    }

    if (!Number.isFinite(rvu) || rvu < 0) {
      setStatus('Enter a valid RVU value.', true);
      rvuInput.focus();
      return;
    }

    procRows.push([name, rvu]);
    nameInput.value = '';
    rvuInput.value = '';
    renderProcedureRows();
    recalc();
    saveCustomRows();
    setStatus('Procedure added', false, true);
  });

  document.getElementById('new-proc-name').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      document.getElementById('add-proc-btn').click();
    }
  });

  document.getElementById('new-proc-rvu').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      document.getElementById('add-proc-btn').click();
    }
  });

  document.getElementById('today').textContent = new Date().toLocaleDateString(undefined, {
    weekday: 'short', month: 'short', day: 'numeric'
  });

  function updateMonthlyTotal() {
    const now = new Date();
    const ym = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    const monthEntries = history.filter(e => e && e.date && e.date.startsWith(ym));
    const sum = monthEntries.reduce((acc, e) => acc + (Number(e.total) || 0), 0);
    document.getElementById('monthly-total').textContent = sum.toFixed(2);
    document.getElementById('monthly-label-month').textContent =
      now.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  }

  function loadHistory() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      history = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(history)) history = [];
    } catch (e) {
      history = [];
    }
    updateMonthlyTotal();
  }

  document.getElementById('save-btn').addEventListener('click', () => {
    const grand = parseFloat(document.getElementById('grand-total').textContent);
    const date = todayISO();
    const idx = history.findIndex(e => e.date === date);
    const entry = { date, total: Math.round(grand * 100) / 100 };
    const isUpdate = idx >= 0;
    if (isUpdate) { history[idx] = entry; } else { history.push(entry); }
    history.sort((a, b) => a.date.localeCompare(b.date));

    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      updateMonthlyTotal();
      setStatus(`${isUpdate ? 'Updated' : 'Saved'} — ${formatDateShort(date)}`, false, true);
    } catch (e) {
      setStatus('Could not save — storage may be full or blocked.', true);
    }
  });

  loadCustomRows();
  renderOfficeRows();
  renderProcedureRows();
  recalc();
  loadHistory();
</script>

</body>
</html>
